<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI Jutawan CRM · Putrajaya</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f0;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* TOKENS */
:root{
  --bg:#ffffff;--bg2:#f5f5f0;--bg3:#eeede8;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
  --red:#CC2030;--red2:#a8191e;
  --green:#1D9E75;--amber:#BA7517;--danger:#E24B4A;--blue:#185FA5;
  --r-md:8px;--r-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1e1e1e;--bg2:#161616;--bg3:#2a2a2a;--text:#e8e8e8;--text2:#aaa;--text3:#666;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2)}
}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);padding:24px}
.login-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:36px 32px;width:100%;max-width:380px}
.login-logo{width:52px;height:52px;border-radius:10px;background:var(--red);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px;margin:0 auto 18px}
.login-title{text-align:center;font-size:20px;font-weight:600;margin-bottom:4px;color:var(--text)}
.login-sub{text-align:center;font-size:13px;color:var(--text2);margin-bottom:28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.field input{width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border 0.15s}
.field input:focus{border-color:var(--red)}
.login-btn{width:100%;padding:11px;border-radius:var(--r-md);border:none;background:var(--red);color:white;font-size:14px;font-weight:600;margin-top:8px;transition:background 0.15s}
.login-btn:hover{background:var(--red2)}
.login-err{color:var(--danger);font-size:12px;text-align:center;margin-top:8px;display:none}

/* WELCOME */
.welcome-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2)}
.welcome-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:48px 40px;text-align:center;max-width:420px;width:90%}
.welcome-icon{width:64px;height:64px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:white;font-size:26px;margin:0 auto 20px}
.welcome-msg{font-size:22px;font-weight:700;margin-bottom:6px;color:var(--text)}
.welcome-sub{font-size:14px;color:var(--text2);margin-bottom:20px}
.welcome-loader{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--text3)}
.dot-anim{display:inline-flex;gap:4px}.dot-anim span{width:5px;height:5px;border-radius:50%;background:var(--red);animation:dot 1.2s infinite}.dot-anim span:nth-child(2){animation-delay:0.2s}.dot-anim span:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}

/* LAYOUT */
.app{display:flex;flex-direction:column;min-height:100vh;background:var(--bg2)}
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{width:30px;height:30px;border-radius:6px;background:var(--red);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:11px;flex-shrink:0}
.logo-text{font-size:15px;font-weight:600;color:var(--text)}
.logo-sub{font-size:11px;color:var(--text2)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nb{padding:6px 12px;border-radius:var(--r-md);border:none;background:transparent;font-size:12px;color:var(--text2);transition:all 0.15s}
.nb.active{background:var(--bg3);color:var(--text);font-weight:600}
.nb:hover:not(.active){background:var(--bg3)}
.user-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.user-badge{padding:3px 10px;border-radius:20px;background:var(--bg3);font-size:11px;font-weight:600;color:var(--text)}
.logout-btn{padding:5px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:transparent;font-size:12px;color:var(--text2);transition:all 0.15s}
.logout-btn:hover{background:var(--bg3)}
.content{padding:16px 20px;flex:1;max-width:1100px;width:100%;margin:0 auto}
.pg{display:none}.pg.active{display:block}

/* ALERT */
.alrt{background:#FCEBEB;border:1px solid #F09595;border-radius:var(--r-md);padding:10px 14px;margin-bottom:14px;font-size:13px;color:#A32D2D;display:flex;align-items:center;gap:8px}

/* AI BAR */
.ai-bar{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:16px}
.ai-row{display:flex;gap:10px;align-items:flex-end}
.ai-ic{width:28px;height:28px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-size:14px}
.ai-inp{flex:1;border:none;background:transparent;font-size:13px;color:var(--text);outline:none;resize:none;line-height:1.5;min-height:20px}
.ai-inp::placeholder{color:var(--text3)}
.ai-btn{padding:6px 14px;border-radius:var(--r-md);border:1px solid var(--border2);background:var(--bg);font-size:12px;color:var(--text2);white-space:nowrap;transition:all 0.15s}
.ai-btn:hover{background:var(--bg3)}
.ai-resp{margin-top:10px;padding:12px 14px;background:var(--bg3);border-radius:var(--r-md);font-size:13px;line-height:1.7;color:var(--text);display:none;white-space:pre-wrap;border-left:3px solid var(--red)}
.ai-loading{display:none;margin-top:8px;font-size:12px;color:var(--text3);align-items:center;gap:6px}
.ai-hint{font-size:11px;color:var(--text3);margin-top:6px;padding-left:38px}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.stat-val{font-size:22px;font-weight:700}

/* UPLOAD */
.ubar{background:var(--bg);border:1px dashed var(--border2);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.15s}
.ubar:hover{background:var(--bg3);border-color:var(--red)}

/* TABLE */
.tbl-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.tbl-head{display:grid;grid-template-columns:36px minmax(0,1fr) 54px 84px 108px 138px 72px;padding:10px 16px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;gap:4px}
.tbl-row{display:grid;grid-template-columns:36px minmax(0,1fr) 54px 84px 108px 138px 72px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:center;gap:4px;cursor:pointer;transition:background 0.1s}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:var(--bg3)}
.mn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.mr{font-size:10px;color:var(--text3)}

/* BADGES */
.cb{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.cg{background:#EAF3DE;color:#3B6D11}.ca{background:#FAEEDA;color:#854F0B}.cr{background:#FCEBEB;color:#A32D2D}.cgr{background:#EEEDE8;color:#5F5E5A}
.sb{display:inline-flex;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.s5{background:#E6F1FB;color:#0C447C}.s4{background:#EAF3DE;color:#3B6D11}.s3{background:#FAEEDA;color:#854F0B}.s2{background:#FCEBEB;color:#A32D2D}.s1{background:#FCEBEB;color:#A32D2D}.s0{background:#EEEDE8;color:#5F5E5A}.sx{background:#FCEBEB;color:#A32D2D}
.dp{display:inline-block;padding:1px 5px;border-radius:20px;font-size:9px;margin-left:3px;font-weight:600}
.dpe{background:#FCEBEB;color:#A32D2D}.dpu{background:#FCEBEB;color:#A32D2D}.dps{background:#FAEEDA;color:#854F0B}.dpk{background:#EAF3DE;color:#3B6D11}

/* BACK BTN */
.bk{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;margin-bottom:14px;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg);transition:all 0.15s}
.bk:hover{background:var(--bg3)}

/* MEMBER DETAIL */
.mh{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.av{width:52px;height:52px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px;flex-shrink:0}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.dc{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px}
.dc h3{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.dr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)}
.dr:last-child{border-bottom:none}
.dk{font-size:12px;color:var(--text2)}.dv{font-size:12px;font-weight:600;color:var(--text)}
.fc{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:14px}
.fc h3{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;display:flex;align-items:center;gap:5px}

/* 54321 STEPS */
.rsteps{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rst{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border)}
.rst.act{border-color:var(--red);background:#FCEBEB}
.rst.dn{background:var(--bg3);opacity:0.7}
.rn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.rn.a{background:var(--red);color:white}.rn.d{background:var(--green);color:white}.rn.p{background:var(--bg3);color:var(--text3)}

/* TLC */
.tlcs{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:14px}
.tlce{padding:8px 10px;background:var(--bg3);border-radius:var(--r-md);margin-bottom:6px;font-size:13px;line-height:1.5}
.tlcd{font-size:10px;color:var(--text3);margin-bottom:2px;font-weight:600}
.tlcw{display:flex;gap:8px;margin-top:8px}
.tlcta{flex:1;border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;font-size:13px;color:var(--text);background:var(--bg);resize:none;height:54px;outline:none;transition:border 0.15s}
.tlcta:focus{border-color:var(--red)}
.tlcbtn{padding:8px 14px;border-radius:var(--r-md);border:1px solid var(--border2);background:var(--bg);font-size:12px;color:var(--text2);align-self:flex-end;transition:all 0.15s}
.tlcbtn:hover{background:var(--bg3)}

/* HAPPINESS GRID */
.hg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hi{padding:8px 10px;background:var(--bg3);border-radius:var(--r-md)}
.hl{font-size:10px;color:var(--text2);margin-bottom:2px;font-weight:500}
.hv{font-size:12px;font-weight:600;color:var(--text);line-height:1.4}

/* RENEWAL TRACKER */
.rtl .rti{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all 0.1s}
.rtl .rti:hover{background:var(--bg3);padding-left:6px;margin:-0px -6px;padding-right:6px;border-radius:var(--r-md)}
.rtl .rti:last-child{border-bottom:none}

/* SEARCH */
.srow2{display:flex;gap:8px;margin-bottom:12px}
.si{flex:1;border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border 0.15s}
.si:focus{border-color:var(--red)}
.fsel{border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;font-size:12px;background:var(--bg);color:var(--text);outline:none}

/* HAPPINESS FORM */
.hform-wrap{max-width:680px;margin:0 auto;padding:0 0 40px}
.hfcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:14px}
.hfcard h2{font-size:18px;font-weight:700;margin-bottom:4px;color:var(--text)}
.hfsub{font-size:13px;color:var(--text2);margin-bottom:20px}
.hfq{margin-bottom:18px}
.hfq label.qlabel{display:block;font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.4;color:var(--text)}
.hfhint{font-size:11px;color:var(--text3);margin-bottom:6px}
.hfopt{display:flex;align-items:flex-start;gap:8px;padding:5px 0;cursor:pointer}
.hfopt input{margin-top:2px;flex-shrink:0;accent-color:var(--red)}
.hfopt span{font-size:13px;line-height:1.4;color:var(--text)}
.hftxt{width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;font-size:13px;color:var(--text);background:var(--bg);resize:none;outline:none;min-height:64px;transition:border 0.15s;line-height:1.5}
.hftxt:focus{border-color:var(--red)}
.hfsel{width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;font-size:13px;color:var(--text);background:var(--bg);outline:none}
.hfsubmit{width:100%;padding:12px;border-radius:var(--r-md);border:none;background:var(--red);color:white;font-size:15px;font-weight:600;margin-top:6px;transition:background 0.15s}
.hfsubmit:hover{background:var(--red2)}
.hfsuccess{background:#EAF3DE;border:1px solid #97C459;border-radius:var(--r-lg);padding:32px;text-align:center}
.hfsuccess h3{font-size:18px;font-weight:700;color:#3B6D11;margin-bottom:8px}
.hfsuccess p{font-size:14px;color:#3B6D11}

/* HAPPINESS LINKS */
.hlrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.hlrow:last-child{border-bottom:none}
.hlink-btn{padding:5px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg);font-size:12px;color:var(--blue);transition:all 0.15s}
.hlink-btn:hover{background:#E6F1FB}
.copy-btn{padding:5px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg);font-size:12px;color:var(--text2);transition:all 0.15s}
.copy-btn:hover{background:var(--bg3)}

/* PANDUAN 54321 */
.p54{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.p54-item{padding:10px;border-radius:var(--r-md);text-align:center}

/* MODAL API KEY */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal{background:var(--bg);border-radius:var(--r-lg);padding:28px;max-width:420px;width:100%;border:1px solid var(--border)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:8px}
.modal p{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.5}
.modal input{width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;font-size:13px;background:var(--bg);color:var(--text);outline:none;margin-bottom:12px;transition:border 0.15s}
.modal input:focus{border-color:var(--red)}
.modal-btns{display:flex;gap:8px}
.modal-save{flex:1;padding:10px;border-radius:var(--r-md);border:none;background:var(--red);color:white;font-size:14px;font-weight:600}
.modal-save:hover{background:var(--red2)}
.modal-skip{padding:10px 16px;border-radius:var(--r-md);border:1px solid var(--border);background:transparent;font-size:14px;color:var(--text2)}
.modal-skip:hover{background:var(--bg3)}
.api-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:20px}
.api-ok{background:#EAF3DE;color:#3B6D11}.api-none{background:#FAEEDA;color:#854F0B}

@media(max-width:640px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .tbl-head,.tbl-row{grid-template-columns:28px minmax(0,1fr) 48px 76px}
  .tbl-head>div:nth-child(n+5),.tbl-row>div:nth-child(n+5){display:none}
  .dgrid{grid-template-columns:1fr}
  .hg{grid-template-columns:1fr}
  .nav{display:none}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
const TODAY = new Date(2026,4,25);
const MN = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const parseDue = s => { const [m,y]=s.split(' '); return new Date(parseInt(y),MN[m],1); };
const daysUntil = s => Math.round((parseDue(s)-TODAY)/86400000);

/* ── USERS ── */
const USERS = {
  mcmrenewal:{pass:'123456',name:'MCM RENEWAL',role:'mcm',welcome:'WELCOME, MCM RENEWAL!',icon:'MCM'},
  vpjutawan: {pass:'123456',name:'VICE PRESIDENT',role:'vp',welcome:'WELCOME, VICE PRESIDENT!',icon:'VP'},
  ambassador:{pass:'12356', name:'GROWTH AMBASSADOR',role:'ga',welcome:'WELCOME, GROWTH AMBASSADOR!',icon:'GA'},
};

/* ── STATE ── */
let currentUser=null, showWelcome=false, currentView='overview';
let currentMember=null, formMemberId=null, rfFilter='all';
let apiKey = localStorage.getItem('bni_apikey')||'';
let showApiModal = !apiKey;

function getStep(due){
  const d=daysUntil(due);
  if(d<0)   return {step:'x',lbl:'Tamat Tempoh',pic:'mcm',cls:'sx',desc:'TAMAT TEMPOH — MCM hubungi segera'};
  if(d<=30)  return {step:1,lbl:'Langkah 1',pic:'mcm',cls:'s1',desc:'Umumkan & terima bayaran'};
  if(d<=60)  return {step:2,lbl:'Langkah 2',pic:'mcm',cls:'s2',desc:'Hantar Renewal Form Online'};
  if(d<=90)  return {step:3,lbl:'Langkah 3',pic:'mcm',cls:'s3',desc:'Pengumuman + MA Training'};
  if(d<=120) return {step:4,lbl:'Langkah 4',pic:'mcm',cls:'s4',desc:'POR Report & Member Review'};
  if(d<=150) return {step:5,lbl:'Langkah 5',pic:'ga', cls:'s5',desc:'Hantar Happiness Feedback Form'};
  return {step:0,lbl:'Belum bermula',pic:'-',cls:'s0',desc:'Lebih 5 bulan lagi'};
}

/* ── MEMBERS ── */
const MB=[
  {no:1,name:"Anuwar Ibrahim Zarali",role:"CEC",mtl:75,color:"GREEN",due:"Sep 2026",tenure:"8M",r121:32,rg:20,vis:10,ty:38194,renew:"Ya"},
  {no:2,name:"Mohd Sallehuddin Kamaruddin",role:"",mtl:75,color:"GREEN",due:"Feb 2027",tenure:"1Y 3M",r121:34,rg:15,vis:10,ty:44038,renew:"Ya"},
  {no:3,name:"Anas Kamarulzaman",role:"",mtl:75,color:"GREEN",due:"Jan 2027",tenure:"4M",r121:24,rg:20,vis:15,ty:9364,renew:"Ya"},
  {no:4,name:"Azmi Ahmad",role:"VP",mtl:70,color:"GREEN",due:"Sep 2026",tenure:"2Y 8M",r121:16,rg:20,vis:10,ty:63577,renew:"Ya"},
  {no:5,name:"Siti Nur Diyana Husna Abd Halim",role:"",mtl:70,color:"GREEN",due:"Aug 2026",tenure:"2Y 9M",r121:49,rg:20,vis:5,ty:143852,renew:"Ya"},
  {no:6,name:"Farah Aina Ghazali",role:"",mtl:70,color:"GREEN",due:"Feb 2027",tenure:"3M",r121:17,rg:20,vis:15,ty:40059,renew:"Ya"},

/* ── HELPERS ── */
function cb(c){const m={GREEN:'cg',AMBER:'ca',RED:'cr',GRAY:'cgr'},l={GREEN:'Hijau',AMBER:'Amber',RED:'Merah',GRAY:'Kelabu'};return `<span class="cb ${m[c]||'cgr'}">${l[c]||c}</span>`;}
function rdisp(m){const h=HP[m.name],r=h?h.renew:m.renew;return r==='Ya'?`<span style="font-size:12px;color:var(--green);font-weight:600">✓ Ya</span>`:r==='Tidak'?`<span style="font-size:12px;color:var(--danger);font-weight:600">✗ Tidak</span>`:`<span style="font-size:12px;color:var(--text3)">—</span>`;}
function ddisp(m){const d=daysUntil(m.due),dc=d<0?'dpe':d<=30?'dpu':d<=90?'dps':'dpk',dl=d<0?`${Math.abs(d)}h lalu`:d===0?'Hari ini!':d<=150?`${d}h`:`${d}h`,fc=d<0||d<=30?'var(--danger)':d<=90?'var(--amber)':'var(--text2)';return `<span style="font-size:12px;color:${fc};font-weight:${d<=90?'600':'400'}">${m.due}<span class="dp ${dc}">${dl}</span></span>`;}
function sbadge(m){const s=getStep(m.due),pl=s.pic==='ga'?`<span style="color:var(--blue);font-size:9px"> GA</span>`:s.pic==='mcm'?`<span style="color:var(--green);font-size:9px"> MCM</span>`:'';return `<span class="sb ${s.cls}">${s.lbl}${pl}</span>`;}
function mc(c){return c==='GREEN'?'var(--green)':c==='AMBER'?'var(--amber)':c==='RED'?'var(--danger)':'var(--text3)';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function callAI(messages, loadingId, respId){
  if(!apiKey){ alert('Sila masukkan API Key terlebih dahulu. Klik ⚙ API Key di header.'); return; }
  const loading=document.getElementById(loadingId), resp=document.getElementById(respId);
  if(loading) loading.style.display='flex';
  if(resp){ resp.style.display='none'; resp.textContent=''; }
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1000,
        system:`Kamu pembantu AI untuk Chapter BNI Jutawan Putrajaya. Tarikh hari ini: 25 Mei 2026. 54321 Renewal Process: Langkah 5(5 bulan sebelum due=GA hantar Happiness Form), 4(4 bulan=MCM POR Report), 3(3 bulan=MCM Pengumuman+MA Training), 2(2 bulan=MCM Renewal Form Online), 1(1 bulan=MCM Umumkan+Bayaran). Jawab dalam Bahasa Melayu dengan ringkas dan praktikal.`,
        messages})
    });
    const data=await res.json();
    if(data.error){ throw new Error(data.error.message); }
    const text=data.content?.map(c=>c.text||'').join('')||'Tidak dapat respons.';
    if(loading) loading.style.display='none';
    if(resp){ resp.style.display='block'; resp.textContent=text; }
  }catch(e){
    if(loading) loading.style.display='none';
    if(resp){ resp.style.display='block'; resp.textContent=`Ralat: ${e.message}. Sila semak API Key anda.`; }
  }
}

async function sendOverviewAI(){
  const q=document.getElementById('ai-q')?.value.trim(); if(!q) return;
  const msgs=[{role:'user',content:`${q}\n\nData ahli:\n${buildCtx()}`}];
  await callAI(msgs,'ai-loading','ai-resp');
}

async function sendMemberAI(no){
  const m=MB.find(x=>x.no==no); if(!m) return;
  const h=HP[m.name],s=getStep(m.due),d=daysUntil(m.due),tlc=TLC[m.name]||[];
  const ctx=`Ahli: ${m.name}, MTL:${m.mtl}, Warna:${m.color}, Due:${m.due}(${d} hari), Langkah:${s.lbl}, PIC:${s.pic==='ga'?'Growth Ambassador':'MCM Renewal'}, Tenure:${m.tenure}, 121:${m.r121}, Referral:${m.rg}, Visitor:${m.vis}, TYFCB:RM${m.ty.toLocaleString()}, Happiness:${h?`feeling=${h.feel},sat=${h.sat},renew=${h.renew},komen="${h.comment}"`:'Belum isi'}, Renew:${h?h.renew:m.renew}, TLC:${tlc.length?tlc.map(n=>n.text).join('; '):'Tiada'}`;
  const msgs=[{role:'user',content:`Berikan analisis ringkas dalam Bahasa Melayu untuk ahli ini. Sertakan: 1) Status prestasi MTL, 2) Status renewal & langkah 54321 semasa, 3) Risiko tidak renew, 4) Arahan spesifik untuk PIC (${s.pic==='ga'?'Growth Ambassador':'MCM Renewal'}), 5) Cadangan TLC.\n\n${ctx}`}];
  await callAI(msgs,'ai-loading-m','ai-resp-m');
}

/* ── EVENTS ── */
function bindEvents(){
  /* Login */
  const lb=document.getElementById('login-btn');
  if(lb) lb.onclick=doLogin;
  const lp=document.getElementById('l-pass');
  if(lp) lp.onkeydown=e=>{ if(e.key==='Enter') doLogin(); };

  /* Nav tabs */
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ currentView=b.dataset.view; currentMember=null; render(); });

  /* Logout */
  const lo=document.getElementById('logout-btn');
  if(lo) lo.onclick=()=>{ currentUser=null; showWelcome=false; currentView='overview'; currentMember=null; formMemberId=null; render(); };

  /* API Key modal */
  const akb=document.getElementById('api-key-btn');
  if(akb) akb.onclick=()=>{ showApiModal=true; render(); };
  const asb=document.getElementById('api-save-btn');
  if(asb) asb.onclick=()=>{ const v=document.getElementById('api-key-input')?.value.trim(); if(v){ apiKey=v; localStorage.setItem('bni_apikey',v); } showApiModal=false; render(); };
  const askp=document.getElementById('api-skip-btn');
  if(askp) askp.onclick=()=>{ showApiModal=false; render(); };

  /* Table rows */
  document.querySelectorAll('[data-mno]').forEach(r=>{
    if(!r.dataset.done&&!r.dataset.copy&&!r.dataset.form&&!r.dataset.rf) r.onclick=()=>{ currentMember=MB.find(x=>x.no==r.dataset.mno); render(); };
  });

  /* Renewal filter */
  document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{ rfFilter=b.dataset.rf; render(); });

  /* Mark done */
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const no=parseInt(b.dataset.done),st=b.dataset.step; if(!DONE[no])DONE[no]={}; DONE[no][st]=true; saveDONE(); render(); });

  /* Back btn */
  const bk=document.getElementById('back-btn');
  if(bk) bk.onclick=()=>{ currentMember=null; render(); };

  /* Form open/close */
  document.querySelectorAll('[data-form]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); formMemberId=parseInt(b.dataset.form); render(); });
  const cfb=document.getElementById('close-form-btn');
  if(cfb) cfb.onclick=()=>{ formMemberId=null; render(); };

  /* Copy link */
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const m=MB.find(x=>x.no==b.dataset.copy); navigator.clipboard?.writeText(`Salam ${m.name.split(' ')[0]}, sila isi Borang Happiness Feedback BNI Jutawan anda. Terima kasih! Due renewal: ${m.due}`); b.textContent='✓ Disalin!'; setTimeout(()=>b.textContent='📋 Salin',2000); });

  /* Search & filter */
  const si=document.getElementById('s-inp'), cf=document.getElementById('c-fil');
  function applyFilter(){ const q=si?.value.toLowerCase()||'',c=cf?.value||''; document.getElementById('tbl2').innerHTML=buildRows(MB.filter(m=>m.name.toLowerCase().includes(q)&&(!c||m.color===c))); }
  if(si) si.oninput=applyFilter;
  if(cf) cf.onchange=applyFilter;

  /* AI Overview */
  const aiq=document.getElementById('ai-q');
  if(aiq) aiq.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendOverviewAI(); } };
  const aisb=document.getElementById('ai-send-btn');
  if(aisb) aisb.onclick=sendOverviewAI;

  /* AI Member */
  const aimb=document.getElementById('ai-member-btn');
  if(aimb) aimb.onclick=()=>sendMemberAI(aimb.dataset.mno);

  /* TLC Save */
  document.querySelectorAll('[id^="tlc-save-"]').forEach(b=>b.onclick=()=>saveTLCEntry(parseInt(b.dataset.mno)));

  /* Form submit */
  const hfs=document.getElementById('hf-submit-btn');
  if(hfs) hfs.onclick=()=>submitForm(parseInt(hfs.dataset.mno));

  /* Upload */
  const pu=document.getElementById('pdf-up');
  if(pu) pu.onchange=e=>{ const f=e.target.files[0]; if(f){ const l=document.getElementById('ul-lbl'); if(l){l.textContent=`✓ ${f.name} — diterima`; l.style.color='var(--green)'; setTimeout(()=>{l.textContent='Upload MTL PDF Baru';l.style.color='';},3000);} } };
}

function doLogin(){
  const u=document.getElementById('l-user')?.value.trim().toLowerCase();
  const p=document.getElementById('l-pass')?.value;
  if(USERS[u]&&USERS[u].pass===p){
    currentUser=USERS[u]; showWelcome=true; render();
    setTimeout(()=>{ showWelcome=false; render(); },2200);
  } else {
    const err=document.getElementById('l-err'); if(err) err.style.display='block';
  }
}

function saveTLCEntry(no){
  const m=MB.find(x=>x.no===no); if(!m) return;
  const inp=document.getElementById(`tlci-${no}`),text=inp?.value.trim(); if(!text) return;
  if(!TLC[m.name]) TLC[m.name]=[];
  const dt=TODAY.toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'});
  TLC[m.name].push({date:dt,text});
  saveTLCS(); render();
}

function submitForm(no){
  const m=MB.find(x=>x.no===no); if(!m) return;
  const sat=document.getElementById('hf-sat')?.value;
  const renew=document.querySelector('input[name="hf-renew"]:checked');
  const intro=document.querySelector('input[name="hf-intro"]:checked');
  const lt=document.querySelector('input[name="hf-lt"]:checked');
  const akui=document.getElementById('hf-akui')?.checked;
  const err=document.getElementById('hf-err');
  if(!sat||!renew||!intro||!lt||!akui){ if(err) err.style.display='block'; return; }
  if(err) err.style.display='none';
  const nilai=[...document.querySelectorAll('input[name="hf-nilai"]:checked')].map(x=>x.value);
  const pertama=[...document.querySelectorAll('input[name="hf-pertama"]:checked')].map(x=>x.value);
  const feel=nilai.length>=12?'Sangat baik':nilai.length>=6?'Ada peningkatan':'Tiada perubahan';
  HP[m.name]={
    sat,renew:renew.value,intro:intro.value,feel,
    survey:document.getElementById('hf-last')?.value||'Baru diisi',
    comment:document.getElementById('hf-extra')?.value||'-',
    bni:document.getElementById('hf-bni')?.value||'-',
    self:document.getElementById('hf-self')?.value||'-',
    tenure:document.getElementById('hf-tenure')?.value||'-',
    lt:lt.value,pertama:pertama.join(', ')||'-',
    introReason:document.getElementById('hf-intro-reason')?.value||'-',
    noRenewReason:document.getElementById('hf-norenew')?.value||'N/A',
    _submitted:true,_date:TODAY.toLocaleDateString('ms-MY')
  };
  saveHP(); formMemberId=null; render();
}

/* ── INIT ── */
loadLocal();
render();
</script>
