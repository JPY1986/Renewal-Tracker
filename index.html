<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNI Jutawan CRM · Putrajaya</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f0;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
:root{
  --bg:#fff;--bg2:#f5f5f0;--bg3:#eeede8;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --red:#CC2030;--red2:#a8191e;
  --green:#1D9E75;--amber:#BA7517;--danger:#E24B4A;--blue:#185FA5;
  --r-md:8px;--r-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1e1e1e;--bg2:#161616;--bg3:#2a2a2a;--text:#e8e8e8;--text2:#aaa;--text3:#666;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2)}
}
/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);padding:24px}
.login-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:36px 32px;width:100%;max-width:380px}
.login-logo{width:52px;height:52px;border-radius:10px;background:var(--red);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px;margin:0 auto 18px}
.login-title{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px}
.login-sub{text-align:center;font-size:13px;color:var(--text2);margin-bottom:28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:600}
.field input{width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border 0.15s}
.field input:focus{border-color:var(--red)}
.login-btn{width:100%;padding:11px;border-radius:var(--r-md);border:none;background:var(--red);color:white;font-size:14px;font-weight:700;margin-top:8px;transition:background 0.15s}
.login-btn:hover{background:var(--red2)}
.login-err{color:var(--danger);font-size:12px;text-align:center;margin-top:8px;display:none}
/* WELCOME */
.welcome-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2)}
.welcome-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:48px 40px;text-align:center;max-width:420px;width:90%}
.welcome-icon{width:64px;height:64px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:white;font-size:28px;margin:0 auto 20px}
.welcome-msg{font-size:22px;font-weight:700;margin-bottom:8px}
.welcome-sub{font-size:14px;color:var(--text2);margin-bottom:20px}
.dot-anim{display:inline-flex;gap:5px;margin-top:8px}
.dot-anim span{width:6px;height:6px;border-radius:50%;background:var(--red);animation:dot 1.2s infinite}
.dot-anim span:nth-child(2){animation-delay:0.2s}.dot-anim span:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}
/* LAYOUT */
.app{display:flex;flex-direction:column;min-height:100vh}
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{width:30px;height:30px;border-radius:6px;background:var(--red);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:11px}
.logo-text{font-size:14px;font-weight:700}
.logo-sub{font-size:11px;color:var(--text2)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nb{padding:6px 12px;border-radius:var(--r-md);border:none;background:transparent;font-size:12px;color:var(--text2);transition:all 0.15s}
.nb.active{background:var(--bg3);color:var(--text);font-weight:600}
.nb:hover:not(.active){background:var(--bg3)}
.user-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.user-badge{padding:3px 10px;border-radius:20px;background:var(--bg3);font-size:11px;font-weight:700}
.icon-btn{padding:5px 10px;border-radius:var(--r-md);border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text2);transition:all 0.15s}
.icon-btn:hover{background:var(--bg3)}
.api-ok{background:#EAF3DE;color:#3B6D11;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.api-none{background:#FAEEDA;color:#854F0B;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.content{padding:16px 20px;flex:1;max-width:1100px;width:100%;margin:0 auto}
/* EMPTY STATE */
.empty-state{min-height:400px;display:flex;align-items:center;justify-content:center}
.empty-card{background:var(--bg);border:2px dashed var(--border2);border-radius:var(--r-lg);padding:48px 40px;text-align:center;max-width:480px;width:100%}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-size:18px;font-weight:700;margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:24px}
.upload-btn-big{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--r-md);border:none;background:var(--red);color:white;font-size:14px;font-weight:700;cursor:pointer;transition:background 0.15s}
.upload-btn-big:hover{background:var(--red2)}
/* UPLOAD PROGRESS */
.parse-modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.parse-card{background:var(--bg);border-radius:var(--r-lg);padding:32px 36px;max-width:400px;width:100%;text-align:center}
.parse-title{font-size:16px;font-weight:700;margin-bottom:8px}
.parse-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.progress-bar{width:100%;height:8px;background:var(--bg3);border-radius:20px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--red);border-radius:20px;transition:width 0.3s}
.parse-status{font-size:12px;color:var(--text3)}
/* PARSE ERROR */
.parse-error{background:#FCEBEB;border:1px solid #F09595;border-radius:var(--r-md);padding:14px;margin-bottom:14px;font-size:13px;color:#A32D2D}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:600}
.stat-val{font-size:22px;font-weight:700}
/* UPLOAD BAR */
.ubar{background:var(--bg);border:1px dashed var(--border2);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.15s}
.ubar:hover{background:var(--bg3);border-color:var(--red)}
/* AI BAR */
.ai-bar{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:14px}
.ai-row{display:flex;gap:10px;align-items:flex-end}
.ai-ic{width:28px;height:28px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:white;font-size:14px}
.ai-inp{flex:1;border:none;background:transparent;font-size:13px;color:var(--text);outline:none;resize:none;line-height:1.5;min-height:20px}
.ai-inp::placeholder{color:var(--text3)}
.ai-btn{padding:6px 14px;border-radius:var(--r-md);border:1px solid var(--border2);background:var(--bg);font-size:12px;color:var(--text2);white-space:nowrap;transition:all 0.15s}
.ai-btn:hover{background:var(--bg3)}
.ai-resp{margin-top:10px;padding:12px 14px;background:var(--bg3);border-radius:var(--r-md);font-size:13px;line-height:1.7;color:var(--text);display:none;white-space:pre-wrap;border-left:3px solid var(--red)}
.ai-loading{display:none;margin-top:8px;font-size:12px;color:var(--text3)}
.ai-hint{font-size:11px;color:var(--text3);margin-top:6px;padding-left:38px}
/* ALERT */
.alrt{background:#FCEBEB;border:1px solid #F09595;border-radius:var(--r-md);padding:10px 14px;margin-bottom:14px;font-size:13px;color:#A32D2D;display:flex;align-items:center;gap:8px}
/* TABLE */
.tbl-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.tbl-head{display:grid;grid-template-columns:36px minmax(0,1fr) 54px 84px 108px 138px 72px;padding:10px 16px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;gap:4px}
.tbl-row{display:grid;grid-template-columns:36px minmax(0,1fr) 54px 84px 108px 138px 72px;padding:11px 16px;border-bottom:1px solid var(--border);align-items:center;gap:4px;cursor:pointer;transition:background 0.1s}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:var(--bg3)}
.mn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr{font-size:10px;color:var(--text3)}
/* BADGES */
.cb{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.cg{background:#EAF3DE;color:#3B6D11}.ca{background:#FAEEDA;color:#854F0B}.cr{background:#FCEBEB;color:#A32D2D}.cgr{background:#EEEDE8;color:#5F5E5A}
.sb{display:inline-flex;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.s5{background:#E6F1FB;color:#0C447C}.s4{background:#EAF3DE;color:#3B6D11}.s3{background:#FAEEDA;color:#854F0B}.s2{background:#FCEBEB;color:#A32D2D}.s1{background:#FCEBEB;color:#A32D2D}.s0{background:#EEEDE8;color:#5F5E5A}.sx{background:#FCEBEB;color:#A32D2D}
.dp{display:inline-block;padding:1px 5px;border-radius:20px;font-size:9px;margin-left:3px;font-weight:700}
.dpe{background:#FCEBEB;color:#A32D2D}.dpu{background:#FCEBEB;color:#A32D2D}.dps{background:#FAEEDA;color:#854F0B}.dpk{background:#EAF3DE;color:#3B6D11}
/* BACK */
.bk{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;margin-bottom:14px;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg);transition:all 0.15s}
.bk:hover{background:var(--bg3)}
/* MEMBER DETAIL */
.mh{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.av{width:52px;height:52px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px;flex-shrink:0}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.dc{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px}
.dc h3{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.dr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border)}
.dr:last-child{border-bottom:none}
.dk{font-size:12px;color:var(--text2)}.dv{font-size:12px;font-weight:700}
.fc{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:14px}
.fc h3{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;display:flex;align-items:center;gap:5px}
/* 54321 STEPS */
.rsteps{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rst{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border)}
.rst.act{border-color:var(--red);background:#FCEBEB}
.rst.dn{background:var(--bg3);opacity:0.7}
.rn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.rn.a{background:var(--red);color:white}.rn.d{background:var(--green);color:white}.rn.p{background:var(--bg3);color:var(--text3)}
/* TLC */
.tlcs{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:14px}
.tlce{padding:8px 10px;background:var(--bg3);border-radius:var(--r-md);margin-bottom:6px;font-size:13px;line-height:1.5}
.tlcd{font-size:10px;color:var(--text3);margin-bottom:2px;font-weight:700}
.tlcw{display:flex;gap:8px;margin-top:8px}
.tlcta{flex:1;border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;font-size:13px;color:var(--text);background:var(--bg);resize:none;height:54px;outline:none;transition:border 0.15s}
.tlcta:focus{border-color:var(--red)}
.tlcbtn{padding:8px 14px;border-radius:var(--r-md);border:1px solid var(--border2);background:var(--bg);font-size:12px;color:var(--text2);align-self:flex-end;transition:all 0.15s}
.tlcbtn:hover{background:var(--bg3)}
/* HAPPINESS */
.hg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hi{padding:8px 10px;background:var(--bg3);border-radius:var(--r-md)}
.hl{font-size:10px;color:var(--text2);margin-bottom:2px;font-weight:600}
.hv{font-size:12px;font-weight:700;line-height:1.4}
/* RENEWAL TRACKER */
.rtl .rti{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.rtl .rti:hover{padding-left:6px;padding-right:6px;margin:0 -6px;border-radius:var(--r-md)}
.rtl .rti:last-child{border-bottom:none}
/* SEARCH */
.srow2{display:flex;gap:8px;margin-bottom:12px}
.si{flex:1;border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border 0.15s}
.si:focus{border-color:var(--red)}
.fsel{border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;font-size:12px;background:var(--bg);color:var(--text);outline:none}
/* HAPPINESS FORM */
.hform-wrap{max-width:680px;margin:0 auto;padding:0 0 40px}
.hfcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:14px}
.hfcard h2{font-size:18px;font-weight:700;margin-bottom:4px}
.hfsub{font-size:13px;color:var(--text2);margin-bottom:20px}
.hfq{margin-bottom:18px}
.hfq label.qlabel{display:block;font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.4}
.hfhint{font-size:11px;color:var(--text3);margin-bottom:6px}
.hfopt{display:flex;align-items:flex-start;gap:8px;padding:5px 0;cursor:pointer}
.hfopt input{margin-top:2px;flex-shrink:0;accent-color:var(--red)}
.hfopt span{font-size:13px;line-height:1.4}
.hftxt{width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;font-size:13px;color:var(--text);background:var(--bg);resize:none;outline:none;min-height:64px;transition:border 0.15s;line-height:1.5}
.hftxt:focus{border-color:var(--red)}
.hfsel{width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 12px;font-size:13px;color:var(--text);background:var(--bg);outline:none}
.hfsubmit{width:100%;padding:12px;border-radius:var(--r-md);border:none;background:var(--red);color:white;font-size:15px;font-weight:700;margin-top:6px;transition:background 0.15s}
.hfsubmit:hover{background:var(--red2)}
.hfsuccess{background:#EAF3DE;border:1px solid #97C459;border-radius:var(--r-lg);padding:32px;text-align:center}
.hfsuccess h3{font-size:18px;font-weight:700;color:#3B6D11;margin-bottom:8px}
.hfsuccess p{font-size:14px;color:#3B6D11}
/* HAPPINESS LINKS */
.hlrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.hlrow:last-child{border-bottom:none}
/* PANDUAN */
.p54{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.p54-item{padding:10px;border-radius:var(--r-md);text-align:center}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal{background:var(--bg);border-radius:var(--r-lg);padding:28px;max-width:420px;width:100%;border:1px solid var(--border)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:8px}
.modal p{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.5}
.modal input{width:100%;border:1px solid var(--border);border-radius:var(--r-md);padding:10px 12px;font-size:13px;background:var(--bg);color:var(--text);outline:none;margin-bottom:12px;transition:border 0.15s}
.modal input:focus{border-color:var(--red)}
.modal-btns{display:flex;gap:8px}
.modal-save{flex:1;padding:10px;border-radius:var(--r-md);border:none;background:var(--red);color:white;font-size:14px;font-weight:700}
.modal-save:hover{background:var(--red2)}
.modal-skip{padding:10px 16px;border-radius:var(--r-md);border:1px solid var(--border);background:transparent;font-size:14px;color:var(--text2)}
.modal-skip:hover{background:var(--bg3)}
@media(max-width:640px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .tbl-head,.tbl-row{grid-template-columns:28px minmax(0,1fr) 48px 76px}
  .tbl-head>div:nth-child(n+5),.tbl-row>div:nth-child(n+5){display:none}
  .dgrid{grid-template-columns:1fr}.hg{grid-template-columns:1fr}.p54{grid-template-columns:repeat(3,1fr)}
  .nav{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── PDF.js setup ──
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── USERS ──
const USERS = {
  mcmrenewal:{pass:'123456',name:'MCM RENEWAL',role:'mcm',welcome:'WELCOME, MCM RENEWAL!'},
  vpjutawan: {pass:'123456',name:'VICE PRESIDENT',role:'vp',welcome:'WELCOME, VICE PRESIDENT!'},
  ambassador:{pass:'12356', name:'GROWTH AMBASSADOR',role:'ga',welcome:'WELCOME, GROWTH AMBASSADOR!'},
};

// ── MTL COLOUR ──
function mtlColor(score){
  if(score>=75) return 'GREEN';
  if(score>=50) return 'AMBER';
  if(score>=25) return 'RED';
  return 'GRAY';
}

// ── DATE HELPERS ──
const MN={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function parseDue(s){const[m,y]=s.split(' ');return new Date(parseInt(y),MN[m],1);}
function daysUntil(s){
  const today=new Date(2026,4,25);
  return Math.round((parseDue(s)-today)/86400000);
}
function getStep(due){
  const d=daysUntil(due);
  if(d<0)   return{step:'x',lbl:'Tamat Tempoh',pic:'mcm',cls:'sx'};
  if(d<=30)  return{step:1,lbl:'Langkah 1',pic:'mcm',cls:'s1'};
  if(d<=60)  return{step:2,lbl:'Langkah 2',pic:'mcm',cls:'s2'};
  if(d<=90)  return{step:3,lbl:'Langkah 3',pic:'mcm',cls:'s3'};
  if(d<=120) return{step:4,lbl:'Langkah 4',pic:'mcm',cls:'s4'};
  if(d<=150) return{step:5,lbl:'Langkah 5',pic:'ga', cls:'s5'};
  return{step:0,lbl:'Belum bermula',pic:'-',cls:'s0'};
}

// ── STATE ──
let currentUser=null, showWelcome=false, currentView='overview';
let currentMember=null, formMemberId=null, rfFilter='all';
let apiKey=localStorage.getItem('bni_apikey')||'';
let showApiModal=false;
let showParseModal=false, parseProgress=0, parseStatus='';
let parseError='';
let MB=[], HP={}, TLC={}, DONE={};
let mtlMonth='', mtlYear='';

// ── LOCAL STORAGE ──
function loadLocal(){
  try{const s=localStorage.getItem('bni_members');if(s)MB=JSON.parse(s);}catch(e){}
  try{const s=localStorage.getItem('bni_hp');if(s)HP=JSON.parse(s);}catch(e){}
  try{const s=localStorage.getItem('bni_tlc');if(s)TLC=JSON.parse(s);}catch(e){}

// ── PDF PARSER ──
async function parseMTLPDF(file){
  showParseModal=true; parseProgress=0; parseStatus='Membuka fail PDF...'; parseError=''; render();
  try{
    const arrayBuffer=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
    const totalPages=pdf.numPages;
    parseStatus=`PDF dibuka — ${totalPages} halaman. Mencari jadual ranking...`;
    parseProgress=10; render();

    // Extract text from all pages
    let allPageTexts=[];
    for(let i=1;i<=totalPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      // Get text with positions
      const items=content.items.map(item=>({
        str:item.str,
        x:Math.round(item.transform[4]),
        y:Math.round(item.transform[5]),
        w:Math.round(item.width)
      }));
      allPageTexts.push({pageNum:i, items});
      if(i<=5){
        parseProgress=10+Math.round((i/Math.min(5,totalPages))*20);
        parseStatus=`Membaca halaman ${i}/${totalPages}...`;
        render();
      }
    }

    parseStatus='Mencari data bulan dan chapter...'; parseProgress=35; render();

    // Find month/chapter info from first few pages
    for(let pg of allPageTexts.slice(0,5)){
      const fullText=pg.items.map(i=>i.str).join(' ');
      const mMatch=fullText.match(/(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+20\d\d/);
      if(mMatch){
        const parts=mMatch[0].split(' ');
        mtlMonth=parts[0]; mtlYear=parts[1];
      }
    }
    if(!mtlMonth) mtlMonth='April'; if(!mtlYear) mtlYear='2026';

    parseStatus='Mengekstrak senarai ahli dari jadual ranking...'; parseProgress=40; render();

    // Parse ranking table — look for pages with member ranking data
    // Key: pages containing "Member Name" header and member rows
    let members=[];
    const MONTHS_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    for(let pg of allPageTexts){
      const fullText=pg.items.map(i=>i.str).join(' ');
      // Ranking pages contain "Member Name" and "Due Date" and "TENURE"
      if(!fullText.includes('Member Name')) continue;
      if(!fullText.includes('TENURE')) continue;

      parseStatus=`Parsing jadual ranking halaman ${pg.pageNum}...`; render();

      // Group items by Y position (same row = same Y ±5px)
      const rows={};
      for(let item of pg.items){
        if(!item.str.trim()) continue;
        const yKey=Math.round(item.y/4)*4;
        if(!rows[yKey]) rows[yKey]=[];
        rows[yKey].push(item);
      }

      // Sort rows by Y descending (top to bottom in PDF coords)
      const sortedYs=Object.keys(rows).map(Number).sort((a,b)=>b-a);

      for(let y of sortedYs){
        const rowItems=rows[y].sort((a,b)=>a.x-b.x);
        const rowText=rowItems.map(i=>i.str).join(' ').trim();

        // Skip header rows
        if(rowText.includes('Member Name')||rowText.includes('LT/LTS')||rowText.includes('Due Date')) continue;
        if(rowText.includes('Ranking order')) continue;

        // Look for member rows: starts with a number (ranking no.)
        const noMatch=rowText.match(/^(\d+)\s+(.+)/);
        if(!noMatch) continue;

        const rankNo=parseInt(noMatch[1]);
        if(rankNo<1||rankNo>100) continue;

        // Extract from full row text
        // Pattern: NO NAME [ROLE] [LT/P] DUE_DATE MTL_SCORES...
        const tokens=rowText.split(/\s+/).filter(t=>t);

        // Find due date (Month YYYY pattern)
        let dueDate='', dueIdx=-1;
        for(let i=0;i<tokens.length;i++){
          if(MONTHS_SHORT.includes(tokens[i]) && tokens[i+1] && tokens[i+1].match(/^20\d\d$/)){
            dueDate=tokens[i]+' '+tokens[i+1];
            dueIdx=i; break;
          }
        }
        if(!dueDate) continue;

        // Name is everything between rank no. and due date (minus role/LT codes)
        // Role codes: CEC, VP, MCM, VH, ST, P, CGC, NEC, CMC, etc.
        const ROLE_CODES=['CEC','VP','MCM','VH','ST','CGC','NEC','CMC','CWM','Engage','Community','Quality','M--','Relate'];
        const afterNo=tokens.slice(1,dueIdx);

        // Separate name from role/P markers
        let nameParts=[], roleParts=[];
        for(let t of afterNo){
          if(t==='P'||t==='-') {roleParts.push(t); continue;}
          if(ROLE_CODES.some(r=>t.startsWith(r))){roleParts.push(t); continue;}
          if(t==='Dropped'){roleParts.push(t); continue;}
          nameParts.push(t);
        }
        const name=nameParts.join(' ').trim();
        const role=roleParts.filter(r=>r!=='P'&&r!=='-'&&r!=='Dropped').join(' ').trim();
        const dropped=roleParts.includes('Dropped');

        if(!name||name.length<2) continue;
        if(dropped) continue; // skip dropped members

        // MTL score: number right after due date
        let mtlScore=0;
        const afterDue=tokens.slice(dueIdx+2);
        // MTL Apr score is usually first numeric after due date
        for(let t of afterDue){
          const n=parseInt(t);
          if(!isNaN(n)&&n>=0&&n<=100){mtlScore=n; break;}
        }

        // TYFCB: look for K values or large numbers in row
        let tyfcb=0;
        const tyfcbMatch=rowText.match(/(\d+(?:\.\d+)?)\s*K\s/g);
        if(tyfcbMatch){
          // Take last K value as TYFCB (usually rightmost)
          const lastK=tyfcbMatch[tyfcbMatch.length-1];
          tyfcb=Math.round(parseFloat(lastK)*1000);
        } else {
          // Look for large number
          const bigNums=rowText.match(/\b(\d{4,7})\b/g);
          if(bigNums) tyfcb=parseInt(bigNums[bigNums.length-1])||0;
        }

        // TENURE: look for pattern like 8M, 1Y 3M, 2Y 11M, 4Y 6M
        const tenureMatch=rowText.match(/(\d+Y\s+\d+M|\d+Y|\d+M)(?:\s|$)/g);
        let tenure='';
        if(tenureMatch) tenure=tenureMatch[tenureMatch.length-1].trim();

        // 121 count: look in participation data
        // For now extract from the row — 121 appears in last section
        let r121=0, rg=0, vis=0;
        const numTokens=afterDue.filter(t=>!isNaN(parseInt(t))&&parseInt(t)>=0);
        // Approximate: Attd, Ref.G, Visitor, Trng, 121, TYFCB columns
        if(numTokens.length>=5){
          r121=parseInt(numTokens[4])||0;
          rg=parseInt(numTokens[1])||0;
          vis=parseInt(numTokens[2])||0;
        }

        const color=mtlColor(mtlScore);

        // Avoid duplicates
        if(members.find(m=>m.no===rankNo)) continue;

        members.push({
          no:rankNo, name, role:role||'',
          mtl:mtlScore, color, due:dueDate, tenure,
          r121, rg, vis, ty:tyfcb, renew:'N/A'
        });
      }
    }

    // Sort by rank number
    members.sort((a,b)=>a.no-b.no);

    parseStatus=`Ditemui ${members.length} ahli. Memproses data individu...`; parseProgress=70; render();

    // Now parse individual member pages for detailed data (121, referral, visitor, TYFCB)
    // Individual pages have "Current MTL" and member name in header
    for(let pg of allPageTexts){
      const fullText=pg.items.map(i=>i.str).join(' ');
      if(!fullText.includes('Current MTL')) continue;
      if(!fullText.includes('Due Date')) continue;

      // Extract member name from this page
      const nameIdx=fullText.indexOf('Member');
      const dueIdx2=fullText.indexOf('Due Date');
      if(nameIdx<0||dueIdx2<0) continue;

      // Get text items near "Member" label to find name
      const memberItems=pg.items.filter(i=>i.str.trim().length>0);
      let memberName='', memberDue='', memberMTL=0, memberTenure='';
      let memberTYFCB=0, member121=0, memberRefGiven=0, memberVisitor=0;

      // Find "Member" label and get value to its right/below
      for(let i=0;i<memberItems.length;i++){
        if(memberItems[i].str==='Member'&&memberItems[i+1]){
          // Next non-empty item at similar Y is the name
          const targetY=memberItems[i].y;
          for(let j=i+1;j<Math.min(i+10,memberItems.length);j++){
            if(Math.abs(memberItems[j].y-targetY)<8&&memberItems[j].str.trim()){
              memberName+=memberItems[j].str+' ';
            } else if(memberItems[j].y!==targetY&&memberName.trim()) break;
          }
          memberName=memberName.trim();
        }
        if(memberItems[i].str==='Due Date'&&memberItems[i+1]){
          const targetY=memberItems[i].y;
          let parts=[];
          for(let j=i+1;j<Math.min(i+8,memberItems.length);j++){
            if(Math.abs(memberItems[j].y-targetY)<8&&memberItems[j].str.trim()){
              parts.push(memberItems[j].str);
            }
          }
          const dueFull=parts.join(' ');
          const dm=dueFull.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+20\d\d/);
          if(dm) memberDue=dm[0];
        }
        if(memberItems[i].str==='Current MTL'&&memberItems[i+1]){
          for(let j=i+1;j<Math.min(i+5,memberItems.length);j++){
            const n=parseInt(memberItems[j].str);
            if(!isNaN(n)&&n>=0&&n<=100){memberMTL=n; break;}
          }
        }
        if(memberItems[i].str==='Tenure'&&memberItems[i+1]){
          const targetY=memberItems[i].y;
          let parts=[];
          for(let j=i+1;j<Math.min(i+6,memberItems.length);j++){
            if(Math.abs(memberItems[j].y-targetY)<8&&memberItems[j].str.trim()){
              parts.push(memberItems[j].str);
            }
          }
          memberTenure=parts.join(' ').trim();
        }
      }

      // Extract TYFCB total from participation table
      const tyfcbMatches=[...fullText.matchAll(/(\d+(?:\.\d+)?)\s*K/g)];
      if(tyfcbMatches.length>0){
        // Find the "Total" TYFCB — usually the largest K value
        let maxK=0;
        for(let m of tyfcbMatches){
          const val=parseFloat(m[1])*1000;
          if(val>maxK) maxK=val;
        }
        memberTYFCB=Math.round(maxK);
      }

      // Extract 121 total
      const totalMatches=fullText.match(/121[^0-9]*(\d+)/);
      if(totalMatches) member121=parseInt(totalMatches[1])||0;

      // Find member in our list and update with better data
      if(memberName&&memberDue){
        const found=members.find(m=>{
          // Fuzzy match — name might differ slightly
          const a=m.name.toLowerCase().replace(/[^a-z]/g,'');
          const b=memberName.toLowerCase().replace(/[^a-z]/g,'');
          return a===b||a.includes(b.substring(0,8))||b.includes(a.substring(0,8));
        });
        if(found){
          if(memberMTL>0) found.mtl=memberMTL;
          found.color=mtlColor(found.mtl);
          if(memberTenure) found.tenure=memberTenure;
          if(memberTYFCB>found.ty) found.ty=memberTYFCB;
          if(member121>found.r121) found.r121=member121;
        }
      }

      parseProgress=Math.min(90, parseProgress+1); render();
    }

    if(members.length===0){
      throw new Error('Tiada data ahli dijumpai dalam PDF. Pastikan fail yang diupload adalah fail MTL BNI yang betul.');
    }

    MB=members;
    saveMembers();

    parseProgress=100;
    parseStatus=`✅ Berjaya! ${members.length} ahli dimuatkan dari PDF ${mtlMonth} ${mtlYear}.`;
    render();
    await new Promise(r=>setTimeout(r,1500));
    showParseModal=false; render();

  } catch(err){
    parseError=err.message||'Ralat tidak diketahui semasa memproses PDF.';
    showParseModal=false; render();
  }
}

function buildRows(arr){
  if(!arr.length) return'<div style="padding:28px;text-align:center;color:var(--text3);font-size:13px">Tiada ahli dijumpai</div>';
  return arr.map(m=>`<div class="tbl-row" data-mno="${m.no}">

        <select class="hfsel" id="hf-tenure"><option value="">Pilih...</option><option>Kurang daripada 6 bulan</option><option>6 bulan hingga 12 bulan</option><option>13 bulan hingga 24 bulan</option><option>Lebih daripada 24 bulan</option></select></div>
      <div class="hfq"><label class="qlabel">3. Adakah anda pernah atau sedang berada dalam Leadership Team atau Support?</label>
        <label class="hfopt"><input type="radio" name="hf-lt" value="Ya"><span>Ya</span></label>
        <label class="hfopt"><input type="radio" name="hf-lt" value="Tidak"><span>Tidak</span></label></div>
      <div class="hfq"><label class="qlabel">4. Semasa anda pertama kali melawat chapter, perkara apa yang menarik perhatian anda?</label>
        <div class="hfhint">Pilih semua yang berkenaan</div>
        ${PL.map(o=>`<label class="hfopt"><input type="checkbox" name="hf-pertama" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>
      <div class="hfq"><label class="qlabel">5. Sila nilaikan diri anda sekarang berbanding ketika mula-mula menyertai BNI</label>
        <div class="hfhint">Pilih semua peningkatan yang anda rasakan</div>
        ${NL.map(o=>`<label class="hfopt"><input type="checkbox" name="hf-nilai" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>
      <div class="hfq"><label class="qlabel">6. Adakah anda berpuas hati dengan keahlian BNI anda?</label>
        <select class="hfsel" id="hf-sat"><option value="">Pilih...</option><option>Ya</option><option>Agak berpuas hati</option><option>Tidak</option></select></div>
      <div class="hfq"><label class="qlabel">7. Adakah anda akan memperkenalkan ahli baru kepada chapter anda?</label>
        <label class="hfopt"><input type="radio" name="hf-intro" value="Ya"><span>Ya</span></label>
        <label class="hfopt"><input type="radio" name="hf-intro" value="Tidak"><span>Tidak</span></label></div>
      <div class="hfq"><label class="qlabel">8. Jelaskan sebab anda memilih Ya atau Tidak (soalan 7)</label>
        <textarea class="hftxt" id="hf-intro-reason" placeholder="Jelaskan..."></textarea></div>
      <div class="hfq"><label class="qlabel">9. Jika keahlian anda tamat sekarang, adakah anda akan memperbaharui?</label>
        <label class="hfopt"><input type="radio" name="hf-renew" value="Ya"><span>Ya</span></label>
        <label class="hfopt"><input type="radio" name="hf-renew" value="Tidak"><span>Tidak</span></label>
        <label class="hfopt"><input type="radio" name="hf-renew" value="Tak Pasti"><span>Tak Pasti</span></label></div>
      <div class="hfq"><label class="qlabel">10. Jika TIDAK renew, jelaskan sebab. Jika YA, tulis N/A.</label>
        <textarea class="hftxt" id="hf-norenew" placeholder="Sebab tidak renew / N/A..."></textarea></div>
      <div class="hfq"><label class="qlabel">11. Apa lagi yang BNI boleh lakukan untuk anda?</label>
        <textarea class="hftxt" id="hf-bni" placeholder="Cadangan anda..."></textarea></div>
      <div class="hfq"><label class="qlabel">12. Apa lagi yang anda boleh lakukan untuk diri sendiri?</label>
        <textarea class="hftxt" id="hf-self" placeholder="Komitmen anda..."></textarea></div>
      <div class="hfq"><label class="qlabel">13. Maklum balas lain / pesanan untuk pasukan kepimpinan?</label>
        <textarea class="hftxt" id="hf-extra" placeholder="Pesanan atau ucapan..."></textarea></div>
      <div class="hfq"><label class="qlabel">14. Bila kali terakhir anda menjawab tinjauan ini?</label>
        <select class="hfsel" id="hf-last"><option value="">Pilih...</option><option>Tidak pernah</option><option>Kurang daripada 6 bulan yang lalu</option><option>6 hingga 12 bulan yang lalu</option><option>Lebih daripada 12 bulan yang lalu</option></select></div>
      <div class="hfq"><label class="hfopt"><input type="checkbox" id="hf-akui"><span style="font-size:13px;font-weight:700">Saya mengaku saya telah menjawab semua soalan dengan jujur & tiada paksaan.</span></label></div>
      <div id="hf-err" style="color:var(--danger);font-size:13px;margin-bottom:10px;display:none;padding:8px 12px;background:#FCEBEB;border-radius:var(--r-md)">⚠ Sila lengkapkan semua soalan wajib dan tandakan akuan.</div>
      <button class="hfsubmit" id="hf-submit-btn" data-mno="${m.no}">📨 Hantar Maklum Balas</button>
      <button id="close-form-btn" style="margin-top:8px;width:100%;padding:10px;border-radius:var(--r-md);border:1px solid var(--border);background:transparent;font-size:14px;color:var(--text2);cursor:pointer">Batal</button>
    </div>
  </div></div>`;
}

// ── AI ──
function buildCtx(){
  return MB.map(m=>{const s=getStep(m.due),d=daysUntil(m.due),h=HP[m.name];return`${m.name}(MTL:${m.mtl},Warna:${m.color},Due:${m.due}/${d}hari,Langkah:${s.lbl},PIC:${s.pic==='ga'?'GA':'MCM'},Renew:${h?h.renew:m.renew},Happiness:${h?h.feel:'Belum isi'},TYFCB:RM${(m.ty||0).toLocaleString()})`;}).join('\n');
}

async function callAI(messages,loadingId,respId){
  if(!apiKey){alert('Sila masukkan API Key terlebih dahulu.');return;}
  const loading=document.getElementById(loadingId),resp=document.getElementById(respId);
  if(loading)loading.style.display='flex';
  if(resp){resp.style.display='none';resp.textContent='';}
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1000,
        system:`Kamu pembantu AI untuk Chapter BNI Jutawan Putrajaya. Tarikh hari ini: 25 Mei 2026. Data MTL: ${mtlMonth} ${mtlYear}. 54321 Renewal: Langkah 5(5bln/GA Happiness Form), 4(4bln/MCM POR), 3(3bln/MCM Pengumuman+MA), 2(2bln/MCM Renewal Form), 1(1bln/MCM Bayaran). Jawab dalam Bahasa Melayu ringkas dan praktikal.`,
        messages})
    });
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const text=data.content?.map(c=>c.text||'').join('')||'Tidak dapat respons.';
    if(loading)loading.style.display='none';
    if(resp){resp.style.display='block';resp.textContent=text;}
  }catch(e){
    if(loading)loading.style.display='none';
    if(resp){resp.style.display='block';resp.textContent=`Ralat: ${e.message}`;}
  }
}

// ── EVENTS ──
function bindEvents(){
  // Login
  const lb=document.getElementById('login-btn');
  if(lb)lb.onclick=doLogin;
  const lp=document.getElementById('l-pass');
  if(lp)lp.onkeydown=e=>{if(e.key==='Enter')doLogin();};

  // Nav
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;currentMember=null;render();});

  // Logout
  const lo=document.getElementById('logout-btn');
  if(lo)lo.onclick=()=>{currentUser=null;showWelcome=false;currentView='overview';currentMember=null;formMemberId=null;render();};

  // API Key modal
  const akb=document.getElementById('api-key-btn');
  if(akb)akb.onclick=()=>{showApiModal=true;render();};
  const asb=document.getElementById('api-save-btn');
  if(asb)asb.onclick=()=>{const v=document.getElementById('api-key-input')?.value.trim();if(v){apiKey=v;localStorage.setItem('bni_apikey',v);}showApiModal=false;render();};
  const askp=document.getElementById('api-skip-btn');
  if(askp)askp.onclick=()=>{showApiModal=false;render();};

  // PDF Upload — main empty state
  const pm=document.getElementById('pdf-main');
  if(pm)pm.onchange=e=>{const f=e.target.files[0];if(f)parseMTLPDF(f);};

  // PDF Upload — ubar
  const pu=document.getElementById('pdf-up');
  if(pu)pu.onchange=e=>{const f=e.target.files[0];if(f)parseMTLPDF(f);};

  // Table rows
  document.querySelectorAll('[data-mno]').forEach(r=>{
    if(!r.dataset.done&&!r.dataset.copy&&!r.dataset.form&&!r.dataset.rf)
      r.onclick=()=>{currentMember=MB.find(x=>x.no==r.dataset.mno);render();};
  });

  // RT rows
  document.querySelectorAll('.rti[data-mno]').forEach(r=>{
    r.onclick=()=>{currentMember=MB.find(x=>x.no==r.dataset.mno);render();};
  });

  // Renewal filter
  document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{rfFilter=b.dataset.rf;render();});

  // Mark done
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();const no=parseInt(b.dataset.done),st=b.dataset.step;
    if(!DONE[no])DONE[no]={};DONE[no][st]=true;saveDONE();render();
  });

  // Back
  const bk=document.getElementById('back-btn');
  if(bk)bk.onclick=()=>{currentMember=null;render();};

  // Form
  document.querySelectorAll('[data-form]').forEach(b=>b.onclick=e=>{e.stopPropagation();formMemberId=parseInt(b.dataset.form);render();});
  const cfb=document.getElementById('close-form-btn');
  if(cfb)cfb.onclick=()=>{formMemberId=null;render();};

  // Copy
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();const m=MB.find(x=>x.no==b.dataset.copy);
    navigator.clipboard?.writeText(`Salam ${m.name.split(' ')[0]}, sila isi Borang Happiness Feedback BNI Jutawan anda. Due renewal: ${m.due}`);
    b.textContent='✓ Disalin!';setTimeout(()=>b.textContent='📋 Salin',2000);
  });

  // Search
  const si=document.getElementById('s-inp'),cf=document.getElementById('c-fil');
  if(si)si.oninput=()=>{const q=si.value.toLowerCase(),c=cf?.value||'';document.getElementById('tbl2').innerHTML=buildRows(MB.filter(m=>m.name.toLowerCase().includes(q)&&(!c||m.color===c)));};
  if(cf)cf.onchange=()=>{const q=si?.value.toLowerCase()||'',c=cf.value;document.getElementById('tbl2').innerHTML=buildRows(MB.filter(m=>m.name.toLowerCase().includes(q)&&(!c||m.color===c)));};

  // AI Overview
  const aiq=document.getElementById('ai-q');
  if(aiq)aiq.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendOverviewAI();}};
  const aisb=document.getElementById('ai-send-btn');
  if(aisb)aisb.onclick=sendOverviewAI;

  // AI Member
  const aimb=document.getElementById('ai-member-btn');
  if(aimb)aimb.onclick=()=>sendMemberAI(aimb.dataset.mno);

  // TLC Save
  document.querySelectorAll('[id^="tlc-save-"]').forEach(b=>b.onclick=()=>saveTLCEntry(parseInt(b.dataset.mno)));

  // Form submit
  const hfs=document.getElementById('hf-submit-btn');
  if(hfs)hfs.onclick=()=>submitForm(parseInt(hfs.dataset.mno));
}

function doLogin(){
  const u=document.getElementById('l-user')?.value.trim().toLowerCase();
  const p=document.getElementById('l-pass')?.value;
  if(USERS[u]&&USERS[u].pass===p){
    currentUser=USERS[u];showWelcome=true;render();
    setTimeout(()=>{showWelcome=false;render();},2200);
  }else{
    const err=document.getElementById('l-err');if(err)err.style.display='block';
  }
}

function saveTLCEntry(no){
  const m=MB.find(x=>x.no===no);if(!m)return;
  const inp=document.getElementById(`tlci-${no}`),text=inp?.value.trim();if(!text)return;
  if(!TLC[m.name])TLC[m.name]=[];
  const dt=new Date(2026,4,25).toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'});
  TLC[m.name].push({date:dt,text});saveTLCS();render();
}

function submitForm(no){
  const m=MB.find(x=>x.no===no);if(!m)return;
  const sat=document.getElementById('hf-sat')?.value;
  const renew=document.querySelector('input[name="hf-renew"]:checked');
  const intro=document.querySelector('input[name="hf-intro"]:checked');
  const lt=document.querySelector('input[name="hf-lt"]:checked');
  const akui=document.getElementById('hf-akui')?.checked;
  const err=document.getElementById('hf-err');
  if(!sat||!renew||!intro||!lt||!akui){if(err)err.style.display='block';return;}
  if(err)err.style.display='none';
  const nilai=[...document.querySelectorAll('input[name="hf-nilai"]:checked')].map(x=>x.value);
  const feel=nilai.length>=12?'Sangat baik':nilai.length>=6?'Ada peningkatan':'Tiada perubahan';
  HP[m.name]={
    sat,renew:renew.value,intro:intro.value,feel,
    survey:document.getElementById('hf-last')?.value||'Baru diisi',
    comment:document.getElementById('hf-extra')?.value||'-',
    bni:document.getElementById('hf-bni')?.value||'-',
    self:document.getElementById('hf-self')?.value||'-',
    tenure:document.getElementById('hf-tenure')?.value||'-',
    lt:lt.value,
    introReason:document.getElementById('hf-intro-reason')?.value||'-',
    noRenewReason:document.getElementById('hf-norenew')?.value||'N/A',
    _submitted:true,_date:new Date(2026,4,25).toLocaleDateString('ms-MY')
  };
  saveHP();formMemberId=null;render();
}

async function sendOverviewAI(){
  const q=document.getElementById('ai-q')?.value.trim();if(!q)return;
  await callAI([{role:'user',content:`${q}\n\nData ahli:\n${buildCtx()}`}],'ai-loading','ai-resp');
}

async function sendMemberAI(no){
  const m=MB.find(x=>x.no==no);if(!m)return;
  const h=HP[m.name],s=getStep(m.due),d=daysUntil(m.due),tlc=TLC[m.name]||[];
  const ctx=`Ahli: ${m.name}, MTL:${m.mtl}, Warna:${m.color}, Due:${m.due}(${d} hari), Langkah:${s.lbl}, PIC:${s.pic==='ga'?'Growth Ambassador':'MCM Renewal'}, Tenure:${m.tenure||'-'}, 121:${m.r121||0}, Referral:${m.rg||0}, Visitor:${m.vis||0}, TYFCB:RM${(m.ty||0).toLocaleString()}, Happiness:${h?`feeling=${h.feel},sat=${h.sat},renew=${h.renew},komen="${h.comment}"`:'Belum isi'}, Renew:${h?h.renew:m.renew}, TLC:${tlc.length?tlc.map(n=>n.text).join('; '):'Tiada'}`;
  await callAI([{role:'user',content:`Berikan analisis ringkas dalam Bahasa Melayu untuk ahli ini. Sertakan: 1) Status prestasi MTL, 2) Status renewal & langkah 54321 semasa, 3) Risiko tidak renew, 4) Arahan spesifik untuk PIC (${s.pic==='ga'?'Growth Ambassador':'MCM Renewal'}), 5) Cadangan TLC.\n\n${ctx}`}],'ai-loading-m','ai-resp-m');
}

// ── INIT ──
loadLocal();
render();
</script>
